<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smalltalk-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e9; --card:#fffdf9; --ink:#1f2a2e; --muted:#6b7478; --line:#e6ddd0;
  --acc:#0f6b66; --acc2:#d0643a; --accSoft:#dcefe9; --acc2Soft:#f8e3d7;
  --ok:#2f8f4e; --okSoft:#dff1e3; --bad:#c2453a; --badSoft:#f9e0dd;
  --shadow:0 1px 2px rgba(30,30,20,.06),0 4px 14px rgba(30,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a1c; --card:#1d2528; --ink:#eef0ee; --muted:#9aa5a8; --line:#2d3a3e;
    --acc:#4fc2b4; --acc2:#f08a5d; --accSoft:#1f3b3a; --acc2Soft:#3d2a22;
    --ok:#5cc47a; --okSoft:#1f3a29; --bad:#ef7a6e; --badSoft:#3e2422; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:680px;margin:0 auto;padding:14px 16px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:680px;margin:0 auto}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
header.top h1 span{color:var(--acc2)}
.langs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;max-width:680px;margin:0 auto;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted);margin-left:4px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on small{color:#ffffffcc}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.tip{padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:12px}
.tip b{color:var(--ink)}
.due{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;margin-bottom:14px;background:var(--acc2Soft);border-color:transparent}
.due b{font-size:16px}
.btn{padding:10px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:800}
.btn.alt{background:var(--acc2)}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.small{padding:7px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.scn{text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.scn .ic{font-size:26px}
.scn .tt{font-weight:800;font-size:15px;line-height:1.2}
.scn .meta{font-size:12px;color:var(--muted);margin-top:auto}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 2px 8px}
.back{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--acc);padding:4px 0 10px}
.scnHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.scnHead .ic{font-size:32px}
.scnHead h2{margin:0;font-size:21px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;padding:9px 8px;border-radius:10px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--muted)}
.tab.on{background:var(--accSoft);color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.toggle.on{color:var(--acc);border-color:var(--acc)}
.phrase{padding:14px 14px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.phrase .txt{flex:1;min-width:0}
.tgt{font-size:19px;font-weight:800;line-height:1.3}
.tgt[dir=rtl]{font-size:23px;text-align:right}
.rom{font-size:14px;color:var(--acc);font-weight:700;margin-top:2px}
.de{font-size:14px;color:var(--muted);margin-top:4px}
.hidden-tgt .tgt,.hidden-tgt .rom{filter:blur(7px);user-select:none}
.ibtns{display:flex;flex-direction:column;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--accSoft);color:var(--acc);font-size:17px;display:grid;place-items:center}
.ib.star{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.ib.star.on{background:var(--acc2Soft);border-color:var(--acc2);color:var(--acc2)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bub{max-width:86%;padding:10px 12px;border-radius:16px;position:relative}
.bub.p{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.bub.u .rom,.bub.u .de{color:#ffffffd0}
.bub .tgt{font-size:17px}
.bub .row{display:flex;gap:8px;align-items:flex-start}
.bub .mini{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accSoft);color:var(--acc);font-size:14px;display:grid;place-items:center}
.bub.u .mini{background:#ffffff26;color:#fff}
.reveal{font-size:13px;font-weight:800;color:var(--acc);margin-top:4px}
.corr{align-self:flex-end;max-width:86%;font-size:13px;background:var(--acc2Soft);border-radius:12px;padding:8px 10px;color:var(--ink)}
.corr b{color:var(--acc2)}
.prompt{padding:12px 14px;margin-bottom:10px;font-size:15px}
.prompt b{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:16px}
.opt .rom{font-size:13px}
.opt.ok{background:var(--okSoft);border-color:var(--ok)}
.opt.bad{background:var(--badSoft);border-color:var(--bad)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
.qcard{padding:18px 16px;margin-bottom:12px;text-align:center}
.qcard .tgt{font-size:22px}
.qcard .tgt[dir=rtl]{text-align:center}
.qcard .lbl{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px}
.done{padding:22px 16px;text-align:center}
.done .big{font-size:42px}
.done h3{margin:6px 0}
.fc{padding:26px 18px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.fc .de{font-size:20px;color:var(--ink);font-weight:800}
.fc .tgt{font-size:24px;color:var(--acc)}
.fc .tgt[dir=rtl]{text-align:center}
.rowbtn{display:flex;gap:10px;margin-top:12px}
.rowbtn .btn{flex:1;padding:14px}
.btn.bad{background:var(--bad)} .btn.ok{background:var(--ok)}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
.composer textarea{flex:1;resize:none;font:inherit;font-size:16px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;max-height:120px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.sug{padding:7px 11px;border-radius:12px;background:var(--accSoft);color:var(--acc);font-weight:700;font-size:14px;text-align:left}
.sug small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.typing{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 4px}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bot div{display:flex;max-width:680px;width:100%}
nav.bot button{flex:1;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
nav.bot button .i{font-size:21px}
nav.bot button.on{color:var(--acc)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--acc2);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.set{padding:14px 16px;margin-bottom:10px}
.set label{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:12px}
.set p{margin:6px 0 0;font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--acc);margin-top:10px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{padding:18px;max-width:360px}
.muted{color:var(--muted)}
.empty{padding:26px 18px;text-align:center}
.scn.locked{opacity:.55;filter:grayscale(1)}
.stars{letter-spacing:1px}.stars .so{opacity:.22;filter:grayscale(1)}
.hero{display:flex;justify-content:space-around;padding:14px 8px;margin-bottom:10px}
.hstat{text-align:center}.hstat b{display:block;font-size:24px;font-weight:800}.hstat span{font-size:12px;color:var(--muted);font-weight:700}
.goal{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:12px;border:2px solid var(--acc)}
.goal .gi{font-size:34px}.goal .gl{font-size:11px;font-weight:800;color:var(--acc);letter-spacing:.5px}
.due{padding:12px 14px}
.lockban{padding:12px 14px;margin-bottom:12px;background:var(--acc2Soft);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.wchip{padding:4px 9px;border-radius:999px;background:var(--card);font-weight:700;font-size:13px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;z-index:30;transition:transform .35s;max-width:92%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{min-height:86px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;padding:6px;display:grid;place-items:center;text-align:center;line-height:1.2}
.mc.open{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.mc.done{background:var(--okSoft);color:var(--ok);border:1.5px solid var(--ok)}
.mc.de.open,.mc.de.done{font-weight:600;font-size:14px}
.tile.lt{min-width:42px;text-align:center;font-size:20px}
.hword{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:26px;font-weight:800;margin:12px 0 4px}
.hl{min-width:22px;border-bottom:3px solid var(--ink);text-align:center;line-height:1.2}
.hl.sp{border:none;min-width:10px}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.kb button{padding:11px 0;border-radius:10px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:17px}
.kb button.hit{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.kb button.miss{opacity:.3}
.xw{display:grid;gap:3px;margin:0 auto 14px}
.xc{aspect-ratio:1;border-radius:6px;background:var(--card);border:1.5px solid var(--line);position:relative;display:grid;place-items:center;padding:0;font-weight:800;font-size:clamp(13px,4.2vw,20px);text-transform:uppercase}
.xc.empty{background:transparent;border:none}
.xc.cur{border-color:var(--acc);background:var(--accSoft)}
.xc.solved{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.xc.good{color:var(--ok)}.xc.wrong{color:var(--bad);border-color:var(--bad)}
.xn{position:absolute;top:1px;left:3px;font-size:9px;font-weight:800;color:var(--muted)}
.xclues{display:flex;flex-direction:column;gap:6px}
.xclue{text-align:left;padding:9px 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.xclue.on{border-color:var(--acc);background:var(--accSoft)}
.xclue.done{opacity:.55}
.chars{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
.chars .tile{min-width:38px;padding:6px 8px;font-size:17px}
.gtab{width:100%;border-collapse:collapse}
.gtab td,.gtab th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.gtab th{font-size:12px;color:var(--muted)}
.gtab td.t{font-weight:800}.gtab td.g{color:var(--muted);font-size:14px}
.gtab tr:last-child td{border-bottom:none}
.gtip{margin-top:10px;font-size:14px;font-weight:700;background:var(--accSoft);color:var(--acc);border-radius:10px;padding:8px 10px}
.gsent{font-size:22px;font-weight:800;line-height:1.5}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--acc)}
.field{min-height:60px;padding:10px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;background:var(--card)}
.field .ph{color:var(--muted);font-size:14px}
.field.ok{border-color:var(--ok);border-style:solid;background:var(--okSoft)}
.field.bad{border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tile{padding:9px 13px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);border-bottom-width:3px;font-weight:800;font-size:17px}
.field .tile{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
.tile:active{transform:translateY(1px)}
.tile.good{background:var(--okSoft)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.tile.wrong{background:var(--badSoft)!important;border-color:var(--bad)!important;color:var(--bad)!important;text-decoration:line-through}
.fb{padding:10px 12px;border-radius:12px;font-weight:800;margin-bottom:12px}
.fb.good{background:var(--okSoft);color:var(--ok)}
.fb.bad{background:var(--badSoft);color:var(--bad)}
.fb .tgt{color:var(--ink)}
.kchip{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accSoft);color:var(--acc)}
.sol{font-size:14px;margin:-4px 0 12px;padding:8px 12px;border-radius:12px;background:var(--acc2Soft)}
.wlist{padding:2px 0;margin-bottom:12px}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .w{font-weight:800;font-size:17px;min-width:96px}
.wrow .g{flex:1;font-size:14px;color:var(--muted)}
.inf{font-size:12px;font-weight:600;color:var(--muted);line-height:1.1;margin-bottom:1px}
.wrow .ib{width:34px;height:34px;font-size:15px}
.fsel{font:inherit;font-size:13px;font-weight:700;padding:6px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);max-width:84px}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:14px}
.seg button small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{border-color:var(--acc);background:var(--accSoft);color:var(--acc)}
.kasten{display:flex;gap:5px;align-items:flex-end;padding:10px 8px 8px;margin:12px 0 10px;border-radius:14px;background:linear-gradient(180deg,#c99d6e,#9f7246);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.fach{position:relative;min-width:0;border-radius:7px;background:#f6eedf;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;box-shadow:inset 0 3px 6px rgba(0,0,0,.18)}
.fach::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--fc)}
.fach .cards{position:absolute;left:4px;right:4px;bottom:0;border-radius:4px 4px 0 0;background:repeating-linear-gradient(to top,#ffffff 0 4px,#ddd0bc 4px 5px)}
.fach .num{position:relative;z-index:1;font-size:21px;font-weight:800;color:#3b2a1a;background:#f6eedfcc;border-radius:8px;padding:0 4px}
.fach .fl{position:relative;z-index:1;font-size:10.5px;font-weight:800;color:#6b5540;white-space:nowrap}
.fach.on{outline:3px solid var(--acc);outline-offset:1px}
.kasten.static .fach{pointer-events:none}
.f0{--fc:#d9534f}.f1{--fc:#ee8a3c}.f2{--fc:#e9c13b}.f3{--fc:#a6c94b}.f4{--fc:#4cb27a}.f5{--fc:#2b8f8a}
.fchip{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;background:var(--fc)}
.r3 .btn{padding:12px 6px;font-size:14px;line-height:1.2}
.r3 .btn small{display:block;font-weight:600;font-size:11px;opacity:.9}
</style>
</head>
<body>
<header class="top"><h1>Smalltalk<span>·</span>Trainer</h1></header>
<div class="langs" id="langs"></div>
<main class="wrap" id="app"></main>
<nav class="bot"><div>
  <button data-v="home"><span class="i">🗺️</span>Lernen</button>
  <button data-v="words"><span class="i">📚</span>Wörter</button>
  <button data-v="games"><span class="i">🎮</span>Spiele</button>
  <button data-v="review"><span class="i">🔁</span>Wiederholen<span class="badge" id="dueBadge" hidden></span></button>
  <button data-v="settings"><span class="i">⚙️</span>Einstellungen</button>
</div></nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============ Szenarien (gemeinsam) ============ */
const SCN = {
  greet:{ic:"👋",t:"Begrüßen & Vorstellen",role:"eine freundliche Person, die der Lernende gerade kennenlernt (z. B. auf einer Terrasse)"},
  me:   {ic:"🙋",t:"Über mich erzählen",role:"ein neugieriger Einheimischer, der wissen will, wer der Lernende ist, woher er kommt und was er macht"},
  cafe: {ic:"☕",t:"Café & Bar",role:"Bedienung in einem Café bzw. einer Bar"},
  rest: {ic:"🍽️",t:"Im Restaurant",role:"Kellner/Kellnerin in einem einfachen Restaurant"},
  shop: {ic:"🛒",t:"Einkaufen & Markt",role:"Verkäufer/in an einem Marktstand"},
  way:  {ic:"🧭",t:"Nach dem Weg fragen",role:"Passant/in auf der Straße, der/die den Weg erklärt"},
  talk: {ic:"☀️",t:"Wetter & Smalltalk",role:"Einheimische/r, der/die neben dem Lernenden auf einer Parkbank sitzt und plaudern möchte"},
  hobby:{ic:"🎒",t:"Hobbys & Freizeit",role:"neue Bekanntschaft in einer Bar, die über Freizeit und Reisen plaudert"},
  camp: {ic:"🚐",t:"Camping & Unterkunft",role:"Mitarbeiter/in an der Rezeption eines Campingplatzes"},
  help: {ic:"🆘",t:"Wenn's hakt: Verständigung",role:"Einheimische/r, der/die anfangs etwas zu schnell spricht; reagiere geduldig, wenn der Lernende um Wiederholung bittet"},
  bye:  {ic:"🤝",t:"Verabschieden & Verabreden",role:"neue Bekanntschaft, mit der man sich verabschiedet und vielleicht wieder verabredet"}
};

/* ============ Sprachdaten ============
   Satz: [Zielsprache, Deutsch, Umschrift?]   Dialog: ["p"|"u", Zielsprache, Deutsch, Umschrift?] */
const L = {
es:{name:"Spanisch",native:"Español",code:"es-ES",
 tip:"<b>Tipp:</b> In Spanien duzt man fast immer (<i>tú</i>). <i>Usted</i> nur bei Älteren oder sehr förmlich. Wo „/a“ steht: -o für Männer, -a für Frauen.",
 order:["greet","me","cafe","rest","shop","way","talk","hobby","camp","help","bye"],
 s:{
 greet:{ph:[
  ["¡Hola! ¿Qué tal?","Hallo! Wie geht's?"],

const mem={};
const store={
  get(k,d){ try{const v=localStorage.getItem("stt_"+k); if(v!==null) return JSON.parse(v);}catch(e){} return k in mem?mem[k]:d; },
  set(k,v){ mem[k]=v; try{localStorage.setItem("stt_"+k,JSON.stringify(v));}catch(e){} }
};

/* ============ Helfer ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lng=()=>L[S.lang];
const scnTitle=(id,l=lng())=>(l.s[id]&&l.s[id].t)||SCN[id].t;
function phrases(id,lc=S.lang){ const l=L[lc]; return (l.s[id]?.ph||[]).map((p,i)=>({t:p[0],de:p[1],r:p[2]||"",key:lc+"|"+id+"|"+i,scn:id})); }
function allPhrases(lc=S.lang){ return L[lc].order.flatMap(id=>phrases(id,lc)); }
function byKey(key){ const [lc,id,i]=key.split("|");
  if(id==="w"){ const w=WORDS[lc]?.[+i]; return w?{t:w[0],de:w[1],r:w[3]||"",key,scn:"w",lc,g:w[2],inf:w[2]===3?(INF[lc]?.[w[0]]||""):""}:null; }
  const p=L[lc]?.s[id]?.ph[+i]; return p?{t:p[0],de:p[1],r:p[2]||"",key,scn:id,lc}:null; }
function tgtHTML(t,r,lc=S.lang,inf){ const l=L[lc]; return `${inf?`<div class="inf">(${esc(inf)})</div>`:""}<div class="tgt" lang="${l.code}"${l.rtl?' dir="rtl"':''}>${esc(t)}</div>${r?`<div class="rom">${esc(r)}</div>`:""}`; }

/* ============ Sprachausgabe ============ */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=()=>{loadVoices(); if(S.view==="settings") render();}; }
function voiceFor(code){ const pre=code.slice(0,2); return voices.find(v=>v.lang===code)||voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(pre)); }
function speak(text,opts={}){
  if(!("speechSynthesis" in window)) return;
  const l=L[opts.lc||S.lang];
  try{
    if(!opts.queue) speechSynthesis.cancel();
    const clean=text.replace(/…/g,", ").replace(/\s\/\s/g,". ");
    const u=new SpeechSynthesisUtterance(clean);
    u.lang=l.code; const v=voiceFor(l.code); if(v) u.voice=v;
    u.rate=opts.slow?Math.max(0.45,settings.rate-0.3):settings.rate;
    if(opts.onend) u.onend=opts.onend;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ Wiederholung (Leitner) ============ */
const IV=[0,1,2,4,8,21].map(d=>d*864e5);
const FACH_TXT=["sofort","nach 1 Tag","nach 2 Tagen","nach 4 Tagen","nach 8 Tagen","nach 3 Wochen"];
function saveSrs(){ store.set("srs",srs); updateBadge(); try{ checkUnlocks(); }catch(e){} }
function addDeck(key){ if(!srs[key]){ srs[key]={b:0,d:Date.now()}; saveSrs(); } }
function removeDeck(key){ delete srs[key]; saveSrs(); }
function setFach(key,b){ srs[key]={b,d:Date.now()+IV[b]}; saveSrs(); }
function grade(key,r){ if(r===true) r=1; if(r===false) r=0; const c=srs[key]||{b:0,d:0}; c.b=r===0?0:r===1?(c.b>=4?3:Math.min(c.b+1,3)):(c.b>=4?5:4); c.d=Date.now()+IV[c.b]; srs[key]=c; saveSrs(); }
function dueKeys(lc=S.lang){ const now=Date.now(); return Object.keys(srs).filter(k=>k.startsWith(lc+"|")&&srs[k].d<=now&&byKey(k)).sort((a,b)=>srs[a].b-srs[b].b); }
function known(key){ return (srs[key]?.b||0)>=4; }
for(const k in srs){ if(srs[k].b>5) srs[k].b=5; }
function updateBadge(){ const n=dueKeys().length, b=$("#dueBadge"); b.hidden=!n; b.textContent=n; }

let sampleFn=null;
(async()=>{ try{ if(window.claude&&typeof claude.use==="function"){ sampleFn=await claude.use("sample"); if(sampleFn&&S.view==="scn") render(); } }catch(e){ sampleFn=null; } })();

/* ============ Render ============ */
function renderLangs(){
  $("#langs").innerHTML=LANG_ORDER.map(k=>`<button class="chip${k===S.lang?" on":""}" data-lang="${k}">${esc(L[k].native)}<small>${k===L[k].native?"":esc(L[k].name)}</small></button>`).join("");
}
function render(){
  renderLangs(); updateBadge();
  document.querySelectorAll("nav.bot button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view||(S.view==="scn"&&b.dataset.v==="home")||(["wlearn","fach"].includes(S.view)&&b.dataset.v==="words")||(S.view==="game"&&b.dataset.v==="games")||(S.view==="gram"&&b.dataset.v==="home")||(S.view==="cards"&&RV&&b.dataset.v===(RV.back==="review"?"review":"words"))));
  const app=$("#app");
  if(S.view==="home") app.innerHTML=homeHTML();
  else if(S.view==="words") app.innerHTML=wordsHTML();
  else if(S.view==="wlearn") renderLearn(app);
  else if(S.view==="fach") app.innerHTML=fachHTML();
  else if(S.view==="cards") renderCards(app);
  else if(S.view==="games") app.innerHTML=gamesHTML();
  else if(S.view==="game") renderGame(app);
  else if(S.view==="gram") renderGram(app);
  else if(S.view==="scn") renderScn(app);
  else if(S.view==="review") renderReview(app);
  else if(S.view==="settings") app.innerHTML=settingsHTML();

function wordOpts(key){
  const p=byKey(key), lc=key.split("|")[0], me=+key.split("|")[2], list=WORDS[lc];
  const ok=i=>i!==me&&list[i][1]!==p.de&&list[i][0]!==p.t;
  // Ablenker aus bekannten Wörtern (diese Runde + Karteikasten), damit Ausschlussverfahren nicht hilft
  const idx=k=>+k.split("|")[2], grp=a=>[...a.filter(i=>list[i][2]===p.g),...a.filter(i=>list[i][2]!==p.g)];
  const sess=grp(shuffle((LS?LS.keys:[]).map(idx).filter(ok)));
  const deck=grp(shuffle(Object.keys(srs).filter(k=>k.startsWith(lc+"|w|")).map(idx).filter(i=>list[i]&&ok(i)&&!sess.includes(i))));
  const rest=grp(shuffle(list.map((_,i)=>i).filter(i=>ok(i)&&!sess.includes(i)&&!deck.includes(i))));
  const pick=[...sess.slice(0,2),...deck,...sess.slice(2),...rest].filter((i,j,a)=>a.findIndex(x=>list[x][1]===list[i][1]||list[x][0]===list[i][0])===j).slice(0,3);

/* --- Satzbau mit Wort-Bausteinen --- */
const noSpace=lc=>lc==="ja"||lc==="th";
function toks(t,r,lc=S.lang){ const src=noSpace(lc)&&r?r:t; return src.split(/\s+/).map(w=>w.replace(/^[¡¿"«(]+|[.,!?;:…"»)。、！？]+$/g,"")).filter(w=>w&&w!=="/"); }
const norm=w=>w.toLowerCase().replace(/[’']/g,"'");
function wordPool(lc=S.lang){ const l=L[lc], s=new Set();
  l.order.forEach(id=>{ (l.s[id].ph||[]).forEach(p=>toks(p[0],p[2],lc).forEach(w=>s.add(w))); (l.s[id].dlg||[]).forEach(x=>toks(x[1],x[3],lc).forEach(w=>s.add(w))); });
  return [...s]; }
function makeTiles(t,r){
  const target=toks(t,r), tn=new Set(target.map(norm));
  const extra=shuffle(wordPool().filter(w=>!tn.has(norm(w)))).slice(0,target.length>6?2:3);
  return shuffle([...target,...extra]).map((w,id)=>({w,id}));
}

/* ============ Lernpfad, Freischalten, Sterne ============ */
const UNLOCK_PCT=0.6;
const vocabCache={};
const isLearned=k=>!!srs[k]&&srs[k].b>=1;
function sceneVocab(id,lc=S.lang){
  const ck=lc+"|"+id; if(vocabCache[ck]) return vocabCache[ck];
  const list=WORDS[lc]; if(!list) return vocabCache[ck]=[];
  const pt=new Set(); phrases(id,lc).forEach(p=>toks(p.t,p.r,lc).forEach(w=>pt.add(norm(w))));
  const out=[]; list.forEach((w,i)=>{ const alts=w[0].split(/\s*\/\s*/);
    if(alts.some(a=>{ const t=a.split(/\s+/).map(x=>norm(x.replace(/^[¡¿]+|[.,!?]+$/g,""))).filter(Boolean); return t.length&&t.every(x=>pt.has(x)); })) out.push(lc+"|w|"+i); });
  return vocabCache[ck]=out;
}
function learnedCount(lc=S.lang){ return wKeys(lc).filter(isLearned).length; }
let unl=store.get("unl",{}), chatDone=store.get("chatDone",{});
function sceneState(id,lc=S.lang){
  const v=sceneVocab(id,lc), have=v.filter(isLearned).length, need=Math.max(1,Math.ceil(v.length*UNLOCK_PCT));
  const locked=!!WORDS[lc]&&v.length>0&&!(unl[lc]||[]).includes(id)&&have<need;
  const ps=phrases(id,lc), pk=ps.filter(p=>isLearned(p.key)).length;
  let stars=locked?0:1;
  if(!locked&&pk>=Math.ceil(ps.length*0.7)) stars=2;
  if(stars===2&&(!L[lc].s[id].dlg||(chatDone[lc]||[]).includes(id))) stars=3;
  const missing=v.filter(k=>!isLearned(k)).sort((a,b)=>(srs[a]?1:0)-(srs[b]?1:0)||(+a.split("|")[2])-(+b.split("|")[2]));
  return {locked,have:Math.min(have,need),need,missing,stars,pk,pt:ps.length};
}
function nextGoal(lc=S.lang){ for(const id of L[lc].order){ const st=sceneState(id,lc); if(st.locked) return {id,st}; } return null; }
function pathKeys(n){ const g=nextGoal(); let ks=g?g.st.missing.slice():[]; if(ks.length<n) ks=ks.concat(wKeys().filter(k=>!srs[k]&&!ks.includes(k))); return ks.slice(0,n); }
let toastT=null;
function toast(msg){ const t=$("#toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3500); }
function checkUnlocks(silent){
  const lc=S.lang; if(!WORDS[lc]) return;
  const list=unl[lc]||(unl[lc]=[]), newly=[];
  for(const id of L[lc].order){ if(list.includes(id)) continue; const v=sceneVocab(id,lc); if(!v.length) continue;
    if(v.filter(isLearned).length>=Math.ceil(v.length*UNLOCK_PCT)){ list.push(id); newly.push(SCN[id].ic+" "+scnTitle(id,L[lc])); } }
  if(newly.length) store.set("unl",unl);
  const wc=learnedCount(lc), seen=store.get("seenWc",{}), prev=seen[lc]??(silent?wc:0);
  if(wc>prev) [...(GRAM[lc]||[]).map(g=>[g.need,"📐 "+g.t]),...GAMES.map(g=>[g.need,g.ic+" "+g.t])].forEach(([n,t])=>{ if(n>prev&&n<=wc) newly.push(t); });
  if(seen[lc]!==Math.max(wc,prev)){ seen[lc]=Math.max(wc,prev); store.set("seenWc",seen); }
  if(newly.length&&!silent) toast("🔓 Freigeschaltet: "+newly.join(", "));
}
function homeHTML(){
  const l=lng(), due=dueKeys().length, hasW=!!WORDS[S.lang];
  const sts=Object.fromEntries(l.order.map(id=>[id,sceneState(id)]));

  if(hasW){

    h+=`<div class="card hero"><div class="hstat"><b>${wc}</b><span>📚 Wörter</span></div><div class="hstat"><b>${un}/${l.order.length}</b><span>🔓 Themen</span></div><div class="hstat"><b>${stars}</b><span>⭐ Sterne</span></div></div>`;
    if(g) h+=`<div class="card goal"><div class="gi">${SCN[g.id].ic}</div><div style="flex:1;min-width:0"><div class="gl">🎯 NÄCHSTES ZIEL</div><b>${esc(scnTitle(g.id))}</b><div class="bar" style="margin-top:6px"><i style="width:${Math.round(g.st.have/g.st.need*100)}%"></i></div><div class="muted" style="font-size:12px;margin-top:3px">${g.st.have}/${g.st.need} Wörter</div></div><button class="btn" data-act="goalLearn">▶</button></div>`;
  }
  if(due) h+=`<div class="card due"><b>🔁 ${due} fällig</b><button class="btn alt small" data-go="review">Los</button></div>`;
  h+=`<div class="sec">Themen · ${esc(l.name)}</div><div class="grid">`;
  for(const id of l.order){

const KB={es:"abcdefghijklmnñopqrstuvwxyz",fr:"abcdefghijklmnopqrstuvwxyz",it:"abcdefghijklmnopqrstuvwxyz"};
const baseCh=(c,lc)=>{ c=c.toLowerCase(); if(lc==="es"&&c==="ñ") return "ñ"; return c.normalize("NFD").replace(/[̀-ͯ]/g,""); };
let G=null;
function gamesHTML(){

function startGame(id){

  else if(id==="scr"){ const ks=pool.filter(k=>/^[\p{L}]{3,10}$/u.test(byKey(k).t)).slice(0,8); G={type:"scr",ks,i:0,right:0}; setupScr(); }

}
function setupScr(){ const k=G.ks[G.i]; if(!k) return; const t=byKey(k).t; let letters; do{ letters=shuffle([...t]).map((c,id)=>({c,id})); }while(t.length>1&&letters.map(x=>x.c).join("")===t);
  Object.assign(G,{k,t,letters,built:[],marks:null,tries:0,ok:false}); }
function setupHang(){ const k=G.ks[G.i%G.ks.length]; Object.assign(G,{k,t:byKey(k).t,guessed:[],wrong:0,max:7,over:false,win:false}); }
function treeSVG(left,max){ const pos=[[62,40],[92,28],[122,42],[50,66],[84,58],[116,66],[142,58]].slice(0,max);

function hangDone(){ const kb=KB[S.lang]; return [...G.t].every(c=>!kb.includes(baseCh(c,S.lang))||G.guessed.includes(baseCh(c,S.lang))); }
function renderGame(app){

  } else if(G.type==="scr"){

    else { const p=byKey(G.k), used=new Set(G.built);

      <div class="field${G.ok?" ok":G.marks?" bad":""}" id="field">${G.built.length?G.built.map((id,i)=>`<button class="tile lt${G.marks?(G.marks[i]?" good":" wrong"):""}" data-sb="${id}" ${G.ok?"disabled":""}>${esc(G.letters[id].c)}</button>`).join(""):`<span class="ph">…</span>`}</div>`;
      if(G.ok) h+=`<div class="fb good">✓ ${esc(G.t)}</div><div class="rowbtn"><button class="btn ghost" data-say="${G.k}">🔊</button><button class="btn" data-act="sNext" style="flex:2">Weiter ›</button></div>`;
      else { if(G.tries>=2) h+=`<div class="sol"><div class="tgt">${esc(G.t)}</div></div>`;
        h+=`<div class="pool">${G.letters.filter(x=>!used.has(x.id)).map(x=>`<button class="tile lt" data-sl="${x.id}">${esc(x.c)}</button>`).join("")}</div>
        <div class="rowbtn" style="margin-top:0"><button class="btn ghost" data-act="sUndo">⌫</button><button class="btn ghost" data-act="sReset">↺</button><button class="btn ok" data-act="sCheck" style="flex:2;font-size:20px">✓</button></div>`; }
    }
  } else if(G.type==="xw"){ h+=xwHTML();

    const kb=KB[S.lang], p=byKey(G.k);

    <div class="hword" lang="${l.code}">${[...G.t].map(c=>{ const b=baseCh(c,S.lang); if(c===" ") return `<span class="hl sp"> </span>`; if(!kb.includes(b)) return `<span class="hl sp">${esc(c)}</span>`; return `<span class="hl">${G.over||G.guessed.includes(b)?esc(c):"&nbsp;"}</span>`; }).join("")}</div></div>`;
    if(G.over) h+=`<div class="fb ${G.win?"good":"bad"}">${G.win?"✓ Gerettet!":"✗ Alle Blätter gefallen"}</div><div class="rowbtn"><button class="btn ghost" data-say="${G.k}">🔊</button><button class="btn" data-act="hNext" style="flex:2">Nächstes Wort ›</button></div>`;
    else h+=`<div class="kb">`+[...kb].map(c=>{ const g=G.guessed.includes(c), hit=g&&[...G.t].some(x=>baseCh(x,S.lang)===c); return `<button data-hk="${c}" class="${g?(hit?"hit":"miss"):""}" ${g?"disabled":""}>${c}</button>`; }).join("")+`</div>`;
  }
  app.innerHTML=h;
}
function memPick(i){
  const c=G.cards[i]; if(G.lock||c.open||c.done) return;
  c.open=true; G.sel.push(c); if(c.side==="t") speak(byKey(c.k).t);
  if(G.sel.length===2){ G.moves++; const [a,b]=G.sel;
    if(a.k===b.k){ a.done=b.done=true; a.open=b.open=false; G.pairs++; G.sel=[]; }
    else { G.lock=true; setTimeout(()=>{ a.open=b.open=false; G.sel=[]; G.lock=false; if(S.view==="game") render(); },1000); } }
  render();
}
function scrCheck(){ if(!G.built.length) return; const got=G.built.map(id=>G.letters[id].c);
  G.marks=got.map((c,i)=>(G.t[i]||"").toLowerCase()===c.toLowerCase()); G.tries++;
  G.ok=got.join("").toLowerCase()===G.t.toLowerCase(); if(G.ok){ speak(G.t); if(G.tries===1) G.right++; grade(G.k,G.tries===1?1:0); }
  render(); }
function hangGuess(c){
  if(G.over||G.guessed.includes(c)) return; G.guessed.push(c);
  if(![...G.t].some(x=>baseCh(x,S.lang)===c)) G.wrong++;
  if(hangDone()){ G.over=true; G.win=true; G.won++; grade(G.k,1); speak(G.t); }
  else if(G.wrong>=G.max){ G.over=true; grade(G.k,0); speak(G.t); }
  render();
}

/* ============ Kreuzworträtsel (Buchstaben antippen) ============ */
const EXTRA_LETTERS={es:"áéíóúñ",it:"àèéìòù",fr:"éèêàçôû",pl:"ąćęłńóśźż",da:"æøå"};
function buildCrossword(cands){
  const grid=new Map(), placed=[], at=(r,c)=>grid.get(r+","+c);
  const can=(t,r,c,dir)=>{ const dr=dir?1:0, dc=dir?0:1; let cross=0;
    if(at(r-dr,c-dc)||at(r+dr*t.length,c+dc*t.length)) return false;
    for(let i=0;i<t.length;i++){ const rr=r+dr*i, cc=c+dc*i, g=at(rr,cc);
      if(g){ if(g.ch!==t[i]||g.dirs.includes(dir)) return false; cross++; }
      else if(at(rr+dc,cc+dr)||at(rr-dc,cc-dr)) return false; }
    return placed.length===0||cross>0; };
  const put=(w,r,c,dir)=>{ const dr=dir?1:0, dc=dir?0:1; for(let i=0;i<w.t.length;i++){ const k=(r+dr*i)+","+(c+dc*i); const g=grid.get(k)||{ch:w.t[i],dirs:[]}; g.dirs.push(dir); grid.set(k,g); } placed.push({...w,r,c,dir}); };
  for(const w of cands){
    if(placed.length>=7) break;
    if(!placed.length){ put(w,0,0,0); continue; }
    let done=false;
    for(const p of shuffle(placed)){ for(let i=0;i<p.t.length&&!done;i++) for(let j=0;j<w.t.length&&!done;j++){
      if(p.t[i]!==w.t[j]) continue; const dir=p.dir?0:1;
      const r=p.dir?p.r+i:p.r-j, c=p.dir?p.c-j:p.c+i;
      if(can(w.t,r,c,dir)){ put(w,r,c,dir); done=true; } } if(done) break; }
  }
  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9; for(const k of grid.keys()){ const [r,c]=k.split(",").map(Number); minR=Math.min(minR,r); maxR=Math.max(maxR,r); minC=Math.min(minC,c); maxC=Math.max(maxC,c); }
  placed.forEach(p=>{ p.r-=minR; p.c-=minC; });
  placed.sort((a,b)=>a.r-b.r||a.c-b.c);
  let n=0; const starts={}; placed.forEach(p=>{ const k=p.r+","+p.c; if(!starts[k]) starts[k]=++n; p.num=starts[k]; });
  return {words:placed,h:maxR-minR+1,w:maxC-minC+1};
}
function startCrossword(){
  const pool=shuffle(wKeys().filter(isLearned).filter(k=>/^[\p{L}]{3,9}$/u.test(byKey(k).t))).map(k=>({k,t:byKey(k).t.toLowerCase()}));
  let best=null; for(let a=0;a<12;a++){ const x=buildCrossword(shuffle(pool)); if(!best||x.words.length>best.words.length) best=x; if(best.words.length>=7) break; }
  G={type:"xw",...best,cells:{},sel:0,ent:null,marks:null,tries:{},right:0};
  best.words.forEach(w=>w.done=false);
  xwSelect(0);
}
const xwCell=(w,i)=>(w.dir?w.r+i:w.r)+","+(w.dir?w.c:w.c+i);
function xwSelect(i){
  G.sel=i; G.marks=null; const w=G.words[i]; if(!w) return;
  G.ent=[...w.t].map((ch,j)=>G.cells[xwCell(w,j)]||null);
  G.lock=G.ent.map(x=>x!==null);
  const need=[...w.t].filter((_,j)=>!G.lock[j]);
  const ex=(EXTRA_LETTERS[S.lang]||"")+"abcdeilmnorstu";
  const extra=shuffle([...ex].filter(c=>!need.includes(c))).slice(0,Math.max(3,Math.min(5,8-need.length)));
  G.pool=shuffle([...need,...extra]).map((c,id)=>({c,id,used:false}));
}
function xwHTML(){
  const l=lng(), cur=G.words[G.sel];
  if(G.words.length<3) return `<div class="card empty"><h3>Mehr Wörter lernen</h3></div>`;
  if(G.words.every(w=>w.done)) return `<div class="card done"><div class="big">🏆</div><h3>${G.right} von ${G.words.length} beim ersten Versuch</h3><div class="rowbtn"><button class="btn" data-act="gAgain">Neues Rätsel</button></div></div>`;
  const map={}; G.words.forEach((w,wi)=>[...w.t].forEach((ch,j)=>{ const k=xwCell(w,j); (map[k]=map[k]||{ws:[]}).ws.push(wi); if(j===0) map[k].num=w.num; }));
  const curCells=cur?[...cur.t].map((_,j)=>xwCell(cur,j)):[];
  let g=`<div class="xw" style="grid-template-columns:repeat(${G.w},1fr);max-width:${Math.min(G.w*40,640)}px">`;
  for(let r=0;r<G.h;r++) for(let c=0;c<G.w;c++){ const k=r+","+c, m=map[k];
    if(!m){ g+=`<div class="xc empty"></div>`; continue; }
    const ci=curCells.indexOf(k); let ch=G.cells[k]||"", cls="xc";
    if(ci>=0){ cls+=" cur"; ch=G.ent[ci]||""; if(G.marks&&G.ent[ci]) cls+=G.marks[ci]?" good":" wrong"; }
    else if(G.cells[k]) cls+=" solved";
    g+=`<button class="${cls}" data-xc="${m.ws.find(wi=>!G.words[wi].done)??m.ws[0]}">${m.num?`<span class="xn">${m.num}</span>`:""}<span class="xl">${esc(ch)}</span></button>`; }
  g+=`</div>`;
  const clue=w=>`<button class="xclue${w===cur?" on":""}${w.done?" done":""}" data-xw="${G.words.indexOf(w)}"><b>${w.num}</b> ${esc(byKey(w.k).de)}${w.done?" ✓":""}</button>`;
  let h=`<div class="qhead"><span>✏️ Kreuzworträtsel</span><span>✓ ${G.words.filter(w=>w.done).length}/${G.words.length}</span></div>${g}`;
  if(cur&&!cur.done){
    h+=`<div class="card prompt"><b>${cur.num} ${cur.dir?"↓":"→"}</b>„${esc(byKey(cur.k).de)}“</div>`;
    if(G.marks) h+=`<div class="fb bad">✗ ${G.marks.filter(Boolean).length} von ${cur.t.length} richtig</div>`;
    h+=`<div class="pool">${G.pool.map(x=>`<button class="tile lt" data-xp="${x.id}" ${x.used?"disabled style=\"visibility:hidden\"":""}>${esc(x.c)}</button>`).join("")}</div>
    <div class="rowbtn" style="margin-top:0"><button class="btn ghost" data-act="xUndo">⌫</button><button class="btn ghost" data-act="xReset">↺</button><button class="btn ok" data-act="xCheck" style="flex:2;font-size:20px">✓</button></div>`;
  }
  h+=`<div class="sec">→ Waagerecht</div><div class="xclues">${G.words.filter(w=>!w.dir).map(clue).join("")}</div><div class="sec">↓ Senkrecht</div><div class="xclues">${G.words.filter(w=>w.dir).map(clue).join("")}</div>`;
  return h;
}
function xwPick(id){ const x=G.pool[id]; if(x.used) return; const j=G.ent.findIndex((e,i)=>e===null&&!G.lock[i]); if(j<0) return; G.ent[j]=x.c; x.used=id; x.slot=j; G.marks=null; render(); }
function xwUndo(){ for(let j=G.ent.length-1;j>=0;j--){ if(!G.lock[j]&&G.ent[j]!==null){ const x=G.pool.find(p=>p.used!==false&&p.slot===j); if(x){ x.used=false; x.slot=null; } G.ent[j]=null; break; } } G.marks=null; render(); }
function xwReset(){ G.ent=G.ent.map((e,j)=>G.lock[j]?e:null); G.pool.forEach(p=>{p.used=false;p.slot=null;}); G.marks=null; render(); }
function xwCheck(){
  const w=G.words[G.sel]; if(G.ent.some(e=>e===null)) return;
  G.tries[G.sel]=(G.tries[G.sel]||0)+1; G.marks=G.ent.map((e,j)=>e===w.t[j]);
  if(G.marks.every(Boolean)){ w.done=true; [...w.t].forEach((ch,j)=>G.cells[xwCell(w,j)]=ch); speak(byKey(w.k).t);
    if(G.tries[G.sel]===1) G.right++; grade(w.k,G.tries[G.sel]===1?1:0);
    const nx=G.words.findIndex(x=>!x.done); if(nx>=0) xwSelect(nx); }
  else { G.ent=G.ent.map((e,j)=>G.lock[j]||G.marks[j]?e:e); }
  render();
}

/* ============ Grammatik ============ */
let GR=null;
const fillBlank=(s,a)=>s.includes("___ ")&&a.endsWith("'")?s.replace("___ ",a):s.replace("___",a);
function startGram(i){ const g=GRAM[S.lang][i]; GR={i,step:"table",q:0,ans:null,right:0,qs:g.ex.map(e=>({s:e[0],c:e[1][0],opts:shuffle(e[1]),de:e[2]}))}; S.view="gram"; render(); window.scrollTo(0,0); }
function renderGram(app){

  let h=`<button class="back" data-go="home">‹ Übersicht</button><div class="scnHead"><div class="ic">${g.ic}</div><h2>${esc(g.t)}</h2></div>`;
  if(GR.step==="table"){
    h+=`<div class="card" style="padding:6px 12px 12px"><table class="gtab">${g.h?`<tr>${g.h.map(x=>`<th>${esc(x)}</th>`).join("")}<th></th></tr>`:""}${g.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${g.say.includes(ci)?"t":"g"}" ${g.say.includes(ci)?`lang="${l.code}"`:""}>${esc(c)}</td>`).join("")}<td style="width:36px"><button class="mini" data-sayt="${esc(g.say.map(ci=>r[ci]).join(", "))}">🔊</button></td></tr>`).join("")}</table>
    ${g.tip?`<div class="gtip">💡 ${esc(g.tip)}</div>`:""}</div><div class="rowbtn"><button class="btn" data-act="grStart">▶ Üben</button></div>`;
  } else if(GR.q>=GR.qs.length){
    h+=`<div class="card done"><div class="big">${GR.right===GR.qs.length?"🏆":"💪"}</div><h3>${GR.right} von ${GR.qs.length}</h3><div class="rowbtn"><button class="btn ghost" data-act="grTable">Tabelle</button><button class="btn" data-act="grAgain">Nochmal</button></div></div>`;
  } else {
    const q=GR.qs[GR.q], a=GR.ans!==null;
    const shown=a?esc(fillBlank(q.s,q.c)):esc(q.s).replace("___",`<span class="blank">&nbsp;</span>`);
    h+=`<div class="qhead"><span>${GR.q+1}/${GR.qs.length}</span><span>✓ ${GR.right}</span></div>

let D=null, Q=null, C=null;
function renderScn(app){
  const id=S.scn, l=lng(), sc=l.s[id];
  const tabs=[["ub","🧩 Üben"]];
  if(sc.dlg) tabs.push(["dlg","💬 Chat"]);
  tabs.push(["quiz","Quiz"],["ai",sceneState(id).stars>=2?"✨ KI-Chat":"✨ KI-Chat 🔒"]);
  if(!tabs.find(t=>t[0]===S.tab)) S.tab="ub";
  let h=`<button class="back" data-go="home">‹ Übersicht</button>
  <div class="scnHead"><div class="ic">${SCN[id].ic}</div><h2>${esc(scnTitle(id))}</h2></div>
  ${lockBanner(id)}
  <div class="tabs">${tabs.map(t=>`<button class="tab${S.tab===t[0]?" on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div id="pane"></div>`;
  app.innerHTML=h;
  if(S.tab==="ub"){ if(!P||P.id!==S.lang+id) startPractice(); else drawPractice(); }
  else if(S.tab==="dlg"){ if(!D||D.id!==S.lang+id) startDialog(); else drawDialog(); }
  else if(S.tab==="quiz"){ if(!Q||Q.id!==S.lang+id) startQuiz(); else drawQuiz(); }
  else if(S.tab==="ai"){ if(!C||C.id!==S.lang+id) C={id:S.lang+id,msgs:[],busy:false,sugs:[],err:""}; drawAI(); }
}

/* --- Satzbau-Baustein (für Üben und Chat) --- */
let B=null;
function newBuilder(t,r,de,onOk){ return {t,r,de,tiles:makeTiles(t,r),built:[],marks:null,ok:false,tries:0,onOk,redraw:null}; }
function bTarget(){ return toks(B.t,B.r).map(norm); }
function builderHTML(extraHead=""){
  const l=lng(), used=new Set(B.built), dir=l.rtl&&!noSpace(S.lang)?'dir="rtl"':"";
  let h=`<div class="card prompt"><b>Sag auf ${esc(l.name)}</b>„${esc(B.de)}“${extraHead}</div>
  <div class="field${B.ok?" ok":B.marks?" bad":""}" id="field" ${dir}>${B.built.length?B.built.map((id,i)=>`<button class="tile${B.marks?(B.marks[i]?" good":" wrong"):""}" data-bb="${id}" lang="${l.code}" ${B.ok?"disabled":""}>${esc(B.tiles[id].w)}</button>`).join(""):`<span class="ph">…</span>`}</div>`;
  if(B.ok){
    h+=`<div class="fb good">✓ Richtig!<div style="margin-top:4px">${tgtHTML(B.t,B.r)}</div></div>
    <div class="rowbtn"><button class="btn ghost" data-act="bSay">🔊 Anhören</button><button class="btn" data-act="bNext" style="flex:2">Weiter ›</button></div>`;
    return h;
  }
  if(B.marks){ const n=B.marks.filter(Boolean).length, len=bTarget().length;
    h+=`<div class="fb bad">✗ ${n} von ${len} Wörtern an der richtigen Stelle</div>`;
    if(B.tries>=2) h+=`<div class="sol">${tgtHTML(B.t,B.r)}</div>`; }
  h+=`<div class="pool" ${l.rtl?'dir="rtl"':""}>${B.tiles.filter(x=>!used.has(x.id)).map(x=>`<button class="tile" data-bt="${x.id}" lang="${l.code}">${esc(x.w)}</button>`).join("")}</div>
  <div class="rowbtn" style="margin-top:0"><button class="btn ghost" data-act="bUndo">⌫</button><button class="btn ghost" data-act="bReset">↺</button><button class="btn ghost" data-act="bHint">💡</button><button class="btn ok" data-act="bCheck" style="flex:2;font-size:20px">✓</button></div>`;
  return h;
}
function bCheck(){
  if(!B.built.length) return;
  const target=bTarget(), got=B.built.map(id=>norm(B.tiles[id].w));
  B.marks=got.map((w,i)=>w===target[i]); B.tries++;
  B.ok=got.length===target.length&&B.marks.every(Boolean);
  if(B.ok&&settings.auto) speak(B.t);
  B.redraw();
  if(!B.ok){ const f=$("#field"); if(f){ f.classList.add("shake"); setTimeout(()=>f.classList.remove("shake"),400); } }
}
function bHint(){
  const target=bTarget(); let k=0; while(k<B.built.length&&k<target.length&&norm(B.tiles[B.built[k]].w)===target[k]) k++;
  B.built=B.built.slice(0,k); B.marks=null; B.tries++;
  if(k<target.length){ const used=new Set(B.built); const t=B.tiles.find(x=>!used.has(x.id)&&norm(x.w)===target[k]); if(t) B.built.push(t.id); }
  B.redraw();
}

/* --- Üben: Sätze der Szene, sortiert nach schon gelernten Wörtern --- */
let P=null;
function learnedSet(lc=S.lang){ const s=new Set(); (WORDS[lc]||[]).forEach((w,i)=>{ if(srs[lc+"|w|"+i]) w[0].split(/\s*\/\s*|\s+/).forEach(x=>{ x=norm(x.replace(/^[¡¿]+|[.,!?]+$/g,"")); if(x) s.add(x); }); }); return s; }
function startPractice(){
  const ls=learnedSet();
  const list=phrases(S.scn).map((p,idx)=>{ const tk=toks(p.t,p.r), kn=tk.filter(w=>ls.has(norm(w))).length; return {p,kn,tot:tk.length,idx}; });
  list.sort((a,b)=>(b.kn/b.tot)-(a.kn/a.tot)||(fachOf(a.p.key)-fachOf(b.p.key))||a.idx-b.idx);
  P={id:S.lang+S.scn,list,i:0,right:0,hasWords:!!WORDS[S.lang]};
  nextPractice();
}
function nextPractice(){
  const it=P.list[P.i]; B=null;
  if(it){ const p=it.p; B=newBuilder(p.t,p.r,p.de); B.redraw=drawPractice;
    B.onOk=()=>{ addDeck(p.key); grade(p.key,B.tries===1?1:0); if(B.tries===1) P.right++; P.i++; nextPractice(); }; }
  drawPractice();
}
function drawPractice(){

function startDialog(){ D={id:S.lang+S.scn,lines:lng().s[S.scn].dlg,i:0,shown:[],wrong:0,opts:null,showDe:false}; advance(); }
function distractors(correct,n){
  const l=lng(); const pool=new Set();
  for(const id of l.order){ (l.s[id].dlg||[]).forEach(x=>{ if(x[0]==="u") pool.add(JSON.stringify([x[1],x[3]||""])); }); (l.s[id].ph||[]).forEach(x=>pool.add(JSON.stringify([x[0],x[2]||""]))); }
  return shuffle([...pool].map(s=>JSON.parse(s)).filter(x=>x[0]!==correct)).slice(0,n);
}
function advance(){
  let first=true;
  while(D.i<D.lines.length&&D.lines[D.i][0]==="p"){ const ln=D.lines[D.i]; D.shown.push({ln,rev:!settings.listen}); if(settings.auto) speak(ln[1],{queue:!first}); first=false; D.i++; }
  if(D.i<D.lines.length){ const ln=D.lines[D.i]; D.opts=shuffle([[ln[1],ln[3]||""],...distractors(ln[1],2)]);
    B=newBuilder(ln[1],ln[3],ln[2]); B.redraw=drawDialog;
    B.onOk=()=>{ if(B.tries>1) D.wrong+=B.tries-1; D.shown.push({ln,rev:true}); D.i++; B=null; advance(); };
  } else { D.opts=null; B=null; }
  drawDialog();
}
function drawDialog(){
  const pane=$("#pane"); if(!pane) return;
  let h=`<div class="tools"><button class="toggle${D.showDe?" on":""}" data-act="dlgDe">${D.showDe?"☑":"☐"} Übersetzung</button>

    <button class="mini" data-sayt="${esc(t)}">🔊</button></div></div>`;
  });
  h+=`</div>`;
  if(D.opts){
    if(settings.build&&B) h+=builderHTML();
    else { const ln=D.lines[D.i]; h+=`<div class="card prompt"><b>Sag auf ${esc(lng().name)}</b>„${esc(ln[2])}“</div><div class="opts">`; D.opts.forEach((o,i)=>h+=`<button class="opt" data-dopt="${i}">${tgtHTML(o[0],o[1])}</button>`); h+=`</div>`; }
  } else {

    h+=`<div class="card done"><div class="big">${D.wrong===0?"🎉":"👏"}</div><h3>Chat geschafft!</h3><p class="muted">${D.wrong===0?"Ohne Fehler.":D.wrong+" Fehlversuch"+(D.wrong>1?"e":"")}</p>

  }

}
function pickDialog(i,el){

function startQuiz(){
  const ps=phrases(S.scn), all=allPhrases();
  const qs=shuffle(ps).slice(0,Math.min(8,ps.length)).map(p=>{
    const dir=Math.random()<.5?"de2t":"t2de";
    let pool=shuffle(ps.filter(x=>x.key!==p.key)); if(pool.length<3) pool=pool.concat(shuffle(all.filter(x=>x.key!==p.key&&!pool.includes(x))));
    return {p,dir,opts:shuffle([p,...pool.slice(0,3)]),ans:null};
  });
  Q={id:S.lang+S.scn,qs,i:0,score:0};
  drawQuiz(); maybeSpeakQ();
}
function maybeSpeakQ(){ const q=Q.qs[Q.i]; if(q&&q.dir==="t2de"&&settings.auto) speak(q.p.t); }
function drawQuiz(){
  const pane=$("#pane"); if(!pane) return;
  if(Q.i>=Q.qs.length){
    const n=Q.qs.length, s=Q.score;
    pane.innerHTML=`<div class="card done"><div class="big">${s===n?"🏆":s>=n*.6?"💪":"🌱"}</div><h3>${s} von ${n} richtig</h3>
    <div class="rowbtn"><button class="btn ghost" data-act="quizRestart">Nochmal</button><button class="btn" data-go="review">Wiederholen</button></div></div>`;
    return;
  }
  const q=Q.qs[Q.i];
  let h=`<div class="qhead"><span>Frage ${Q.i+1}/${Q.qs.length}</span><span>✓ ${Q.score}</span></div><div class="card qcard">`;
  if(q.dir==="de2t") h+=`<div class="lbl">Wie sagt man das?</div><div class="tgt" style="color:var(--ink)">${esc(q.p.de)}</div>`;
  else h+=`<div class="lbl">Was bedeutet das?</div>${tgtHTML(q.p.t,q.p.r)}<div style="margin-top:10px"><button class="ib" style="margin:0 auto" data-say="${esc(q.p.key)}">🔊</button></div>`;
  h+=`</div><div class="opts">`;
  q.opts.forEach((o,i)=>{
    let cls=""; if(q.ans!==null){ if(o.key===q.p.key) cls=" ok"; else if(i===q.ans) cls=" bad"; }
    h+=`<button class="opt${cls}" data-qopt="${i}" ${q.ans!==null?"disabled":""}>${q.dir==="de2t"?tgtHTML(o.t,o.r,S.lang,o.inf):esc(o.de)}</button>`;
  });
  h+=`</div>`;
  if(q.ans!==null) h+=`<div class="rowbtn"><button class="btn" data-act="quizNext">Weiter ›</button></div>`;
  pane.innerHTML=h;
}
function pickQuiz(i){
  const q=Q.qs[Q.i]; if(q.ans!==null) return;
  q.ans=i; const ok=q.opts[i].key===q.p.key; if(ok) Q.score++;
  addDeck(q.p.key); grade(q.p.key,ok);
  if(q.dir==="de2t"||!ok) speak(q.p.t);
  drawQuiz();
}

function buildPrompt(){
  const l=lng(), sc=SCN[S.scn];
  const romRule=l.rom?`- "reply_roman": lateinische Umschrift von "reply" (bei Japanisch Hepburn, bei Russisch einfache Transliteration, bei Arabisch vereinfachte wissenschaftliche Umschrift). Auch jeder Vorschlag bekommt "r" mit Umschrift.`:`- "reply_roman" und "r" bleiben leer ("").`;
  const extra=S.lang==="ar"?"- Verwende einfaches Hocharabisch (Fusha) mit Vokalisierung nur wo nötig, keine Dialektformen.\n":"";
  const transcript=C.msgs.map(m=>(m.who==="ai"?"Partner: ":"Lernender: ")+m.t).join("\n");
  return `Du bist Gesprächspartner in einer Sprachlern-App. Der Lernende heißt Rumi, spricht Deutsch und lernt ${l.name} auf Anfängerniveau (A1). Ziel: einfacher Smalltalk im Alltag.

Regeln:

- Bleib in deiner Rolle und in der Szene. Nutze vor allem Grundwortschatz.
${extra}- "reply_de": deutsche Übersetzung deiner Antwort.
- "correction": Hat die LETZTE Nachricht des Lernenden echte Fehler, erkläre sie auf Deutsch in einem kurzen Satz und nenne die korrigierte Version. Akzente, Satzzeichen und Groß-/Kleinschreibung ignorieren. Schreibt der Lernende (teilweise) auf Deutsch, gib hier an, wie man das auf ${l.name} sagt, und antworte, als hätte er es so gesagt. Sonst "".
- "suggestions": genau 3 kurze, einfache Antworten, die der Lernende auf deine Nachricht geben könnte – Objekte mit "t" (auf ${l.name}), "r" und "de" (Deutsch).
${romRule}
Antworte ausschließlich mit JSON in genau dieser Form:
{"reply":"","reply_roman":"","reply_de":"","correction":"","suggestions":[{"t":"","r":"","de":""}]}

Bisheriges Gespräch:
${transcript||"(noch leer)"}

${C.msgs.length?"Antworte jetzt auf die letzte Nachricht des Lernenden.":"Eröffne das Gespräch mit einer passenden ersten Aussage oder Frage."}`;

async function aiTurn(){
  if(!sampleFn||C.busy) return;
  const cid=C.id; C.busy=true; C.err=""; C.sugs=[]; drawAI();
  try{
    let res;
    try{ res=await sampleFn.json(buildPrompt(),{modelTier:"quick",cache:false}); }
    catch(e){ if(e&&(e.code==="not_granted"||e.code==="rate_limited")) throw e;
      const r=await sampleFn(buildPrompt(),{modelTier:"quick",cache:false}); const m=(r.text||"").match(/\{[\s\S]*\}/); res=JSON.parse(m?m[0]:r.text); }
    if(!C||C.id!==cid) return;
    const lastMe=[...C.msgs].reverse().find(m=>m.who==="me"); if(lastMe&&res.correction) lastMe.corr=res.correction;
    C.msgs.push({who:"ai",t:res.reply||"…",r:res.reply_roman||"",de:res.reply_de||"",showDe:false});
    C.sugs=Array.isArray(res.suggestions)?res.suggestions.slice(0,3):[];
    { const seen=new Set(), tw=[]; C.sugs.forEach(s=>toks(s.t||"",s.r||"").forEach(w=>{ const n=norm(w); if(!seen.has(n)){ seen.add(n); tw.push(w); } })); C.tw=shuffle(tw); }
    if(settings.auto&&res.reply) speak(res.reply);
  }catch(e){
    if(e&&e.code==="not_granted"){ sampleFn=null; C.busy=false; render(); return; }
    C.err=e&&e.code==="rate_limited"?"Gerade zu viele Anfragen – bitte kurz warten und nochmal senden.":"Das hat nicht geklappt. Bitte nochmal versuchen.";
  }
  C.busy=false; drawAI();
}

  if(d.reveal!==undefined&&t.classList.contains("hidden-tgt")){ t.classList.remove("hidden-tgt"); return; }
  switch(d.act){
    case "dlgDe": D.showDe=!D.showDe; drawDialog(); break;
    case "listen": settings.listen=!settings.listen; store.set("settings",settings); drawDialog(); break;
    case "dlgRestart": startDialog(); break;
    case "build": settings.build=!settings.build; store.set("settings",settings); drawDialog(); break;
    case "bUndo": if(B){ B.built.pop(); B.marks=null; B.redraw(); } break;
    case "bReset": if(B){ B.built=[]; B.marks=null; B.redraw(); } break;
    case "bHint": if(B) bHint(); break;
    case "bCheck": if(B) bCheck(); break;
    case "bSay": if(B) speak(B.t); break;
    case "bNext": if(B&&B.ok) B.onOk(); break;
    case "pRestart": startPractice(); break;
    case "aiTiles": settings.aiTiles=true; store.set("settings",settings); drawAI(); break;
    case "aiSugs": settings.aiTiles=false; store.set("settings",settings); drawAI(); break;
    case "goalLearn": { const ks=pathKeys(settings.wcount||5); if(ks.length) startLearn(ks,"home"); break; }
    case "scnLearn": { const ks=sceneState(S.scn).missing.slice(0,10); if(ks.length) startLearn(ks,"scn"); break; }
    case "gAgain": startGame(G.type); break;
    case "xUndo": xwUndo(); break;
    case "xReset": xwReset(); break;
    case "xCheck": xwCheck(); break;
    case "sUndo": G.built.pop(); G.marks=null; render(); break;
    case "sReset": G.built=[]; G.marks=null; render(); break;
    case "sCheck": scrCheck(); break;
    case "sNext": G.i++; setupScr(); render(); break;
    case "hNext": G.i++; setupHang(); render(); break;
    case "grStart": GR.step="ex"; GR.q=0; GR.ans=null; GR.right=0; render(); break;
    case "grTable": GR.step="table"; render(); break;
    case "grAgain": startGram(GR.i); GR.step="ex"; render(); break;
    case "grNext": GR.q++; GR.ans=null; render(); break;
    case "wNew": if((settings.wset||"pfad")==="pfad"){ const ks=pathKeys(settings.wcount||5); if(ks.length) startLearn(ks); break; } { const s=wSets().find(x=>x.id===settings.wset)||wSets()[0]; let ks=wKeys().slice(s.a,s.b).filter(k=>!srs[k]); if(!ks.length) ks=wKeys().filter(k=>!srs[k]); if(ks.length) startLearn(ks.slice(0,settings.wcount||5)); break; }
    case "wDue": startCards(dueKeys(),"Fällige Karten","words"); break;
    case "wMix": startCards(mixKeys(deckKeys()),"Gemischt aus allen Fächern","words"); break;
    case "fachLearn": startCards(shuffle(deckKeys().filter(k=>fachOf(k)===S.fach)),"Fach "+S.fach,"fach"); break;
    case "revStart": startCards(dueKeys(),"Fällige Karten","review"); break;
    case "lsNext": nextStep(); break;
    case "lsFlip": LS.flip=true; render(); speak(byKey(LS.steps[LS.i].k).t); break;
    case "cFlip": RV.flip=true; render(); if(rvFront(RV.queue[0])==="de") speak(byKey(RV.queue[0]).t); break;
    case "quizRestart": startQuiz(); break;
    case "quizNext": Q.i++; drawQuiz(); maybeSpeakQ(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "aiStart": aiTurn(); break;
    case "aiReset": C={id:C.id,msgs:[],busy:false,sugs:[],err:""}; drawAI(); break;
    case "testVoice": speak(allPhrases()[0].t); break;
    case "resetLang": confirmBox(`Fortschritt für ${lng().name} wirklich löschen?`,()=>{ Object.keys(srs).forEach(k=>{ if(k.startsWith(S.lang+"|")) delete srs[k]; }); saveSrs(); render(); }); break;
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="aiForm") return; e.preventDefault();
  const ta=$("#aiIn"); const v=(ta.value||"").trim(); if(!v||C.busy) return;
  C.msgs.push({who:"me",t:v}); aiTurn();
});
document.addEventListener("input",e=>{
  const k=e.target.dataset.set; if(!k) return;
  if(k==="rate"){ settings.rate=+e.target.value; e.target.previousElementSibling.querySelector("span").textContent=Math.round(settings.rate*100)+" %"; }
  store.set("settings",settings);
});
document.addEventListener("change",e=>{
  const fk=e.target.dataset.fsel;
  if(fk){ const v=+e.target.value; v<0?removeDeck(fk):setFach(fk,v); const kw=$("#kastenWrap"); if(kw) kw.innerHTML=kastenHTML(deckKeys()); if(S.view==="fach"||S.view==="review") render(); return; }
  const k=e.target.dataset.set; if(!k||k==="rate") return;
  settings[k]=e.target.checked; store.set("settings",settings);
});

try{ for(const lc of Object.keys(WORDS)){ const keep=S.lang; S.lang=lc; checkUnlocks(true); S.lang=keep; } }catch(e){}
render();
</script>
</body>
