name: APK bauen

on:
  push:
    paths:
      - "smalltalk-trainer.html"
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Signaturschlüssel aus Secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_B64 fehlt – APK wird mit Debug-Schlüssel signiert (Updates nicht drüberinstallierbar)."
          fi

      - name: APK bauen
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../Smalltalk-Trainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Smalltalk-Trainer-apk
          path: Smalltalk-Trainer.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Smalltalk-Trainer 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Smalltalk-Trainer.apk
          body: |
            APK auf dem Handy herunterladen und öffnen („Installation aus unbekannten Quellen“ erlauben).
